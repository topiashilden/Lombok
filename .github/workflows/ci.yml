# Checks every pull request and every push to main, so a merge can't quietly break the app.
# Steps: install, lint, build (includes the TypeScript check), then a smoke test that starts the
# built app and checks that the main pages and API routes answer. No secrets needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes type check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Smoke test
        run: npm run smoke
